<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="المقاضي">
<title>مقاضي البيت</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Readex Pro";src:url("fonts/ReadexPro.ttf") format("truetype");font-weight:160 700;font-display:swap}
:root{
  --bg:#F4F6F1;--card:#FFFFFF;--ink:#1C2620;--muted:#56655B;--line:#DCE3D8;--soft:#E3E8DF;
  --green:#2F7D5B;--green-soft:#E6F2EA;--amber:#F3E6C9;--amber-ink:#7A4E0E;--red:#B42318;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:"Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scr{scrollbar-width:none}.scr::-webkit-scrollbar{display:none}

#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
header{padding:calc(18px + var(--safe-t)) 18px 10px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{display:flex;flex-direction:column;gap:1px;min-width:0}
.title small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title h1{margin:0;font-size:24px;font-weight:700;white-space:nowrap}
.tools{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;color:#2F5D46;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA59D;flex:none}
.pill.online .dot{background:#2F9E6A}.pill.connecting .dot,.pill.offline .dot{background:#D9922E}.pill.error .dot{background:var(--red)}
.pill.error{color:var(--red)}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:var(--soft);border-radius:14px}
.seg button{height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(28,38,32,.12)}
.seg .cnt{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--green);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}

main{flex:1;min-height:0;overflow-y:auto;padding:0 18px 16px;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.view[hidden]{display:none}
.addrow{display:flex;gap:8px;position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 6px;margin:-4px 0 -6px}
.addrow input{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:14px;border:1.5px dashed #A9B8A4;background:var(--card);font-size:15px;outline:none}
.addrow input:focus{border-style:solid;border-color:var(--green)}
.btn{height:46px;padding:0 18px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;flex:none}
.btn.green{background:var(--green)}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.danger{background:#FBE9E7;color:var(--red)}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px}
.chips button{flex:none;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:#33413A;font-size:13px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{font-size:13px;color:var(--amber-ink);background:var(--amber);padding:10px 12px;border-radius:12px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:420px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ghead{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--muted);padding:8px 2px 0}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:15px 4px 11px;border-radius:18px;border:2px solid var(--card);background:var(--card);min-height:112px}
.tile.on{border-color:var(--green);background:var(--green-soft)}
.tile .nm{font-size:13.5px;font-weight:500;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.vis{width:54px;height:54px;display:flex;align-items:center;justify-content:center;flex:none}
.vis .em{font-size:40px;line-height:1}
.vis img{width:54px;height:54px;border-radius:15px;object-fit:cover}
.vis .ini{width:54px;height:54px;border-radius:16px;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.ck{position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.hint.done{background:var(--green-soft);color:#1F5A40}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--green);padding:6px 0}
.badge-new{position:absolute;top:7px;right:7px;padding:1px 7px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font-size:10px;font-weight:600}
.ed{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.tile.addtile{border:2px dashed var(--green);background:var(--green-soft);color:var(--green)}
.tile.addtile .ini{background:var(--green);color:#fff}
.pop{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.92)}100%{transform:scale(1)}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:14px;padding:36px 12px;line-height:1.8}

.prog{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.prog .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog b{font-size:16px;font-weight:600}.prog span{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.shead{font-size:13px;font-weight:600;color:var(--muted);padding:6px 2px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:9px 13px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:right}
.row .vis,.row .vis img,.row .vis .ini{width:44px;height:44px}
.row .vis{border-radius:13px;background:#F1F4EE}
.row .vis .em{font-size:28px}.row .vis .ini{font-size:20px;border-radius:13px}
.row .rn{flex:1;font-size:16px;font-weight:500}
.row .rc{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid #A9B8A4;display:flex;align-items:center;justify-content:center;color:transparent}
.row.got{background:var(--green);border-color:var(--green);color:#fff}
.row.got .rn{text-decoration:line-through}
.row.got .vis{background:#fff}
.row.got .rc{background:#fff;border-color:#fff;color:var(--green)}

footer{padding:8px 18px calc(14px + var(--safe-b))}
.dock{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:20px;background:var(--ink);color:#fff}
.dock .n{min-width:40px;height:40px;padding:0 6px;border-radius:13px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex:none}
.dock .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dock .t b{font-size:14px;font-weight:600}
.dock .t span{font-size:12px;color:#C3CFBF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock button{height:42px;min-width:42px;border:0;border-radius:13px;background:#2C3830;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:14px;font-weight:600;flex:none}
.dock button.fin{background:var(--green)}

#scrim{position:fixed;inset:0;background:rgba(20,28,23,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#scrim[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:#C9D2C5;margin:0 auto 2px}
.sheet h2{margin:0;font-size:19px;font-weight:700}
.sheet p{margin:0;font-size:14px;color:var(--muted);line-height:1.8}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:15px;outline:none}
.field textarea{min-height:110px;font-size:12.5px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:15px;font-weight:700}
.phrow{display:flex;align-items:center;gap:12px}
.phrow .vis{background:var(--card);border-radius:15px;border:1px solid var(--line)}
.err{color:var(--red);font-size:13px}
.about{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.9}
.about a{color:var(--green)}

#toast{position:fixed;left:50%;bottom:calc(98px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <div class="title"><small id="kicker">قائمة العائلة</small><h1>مقاضي البيت</h1></div>
      <div class="tools">
        <button id="syncPill" class="pill" type="button"><span class="dot"></span><span id="syncTxt">محلي</span></button>
        <button id="editBtn" class="icon-btn" type="button" aria-label="تعديل المربعات" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>
        </button>
        <button id="setBtn" class="icon-btn" type="button" aria-label="الإعدادات">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="seg" role="group" aria-label="الوضع">
      <button id="tabPick" type="button" aria-pressed="true">أختار الطلبات</button>
      <button id="tabShop" type="button" aria-pressed="false">في السوق <span id="shopCnt" class="cnt" hidden></span></button>
    </div>
  </header>

  <main id="main" class="scr">
    <section id="pickView" class="view">
      <form id="addForm" class="addrow" autocomplete="off">
        <label for="q" class="sr">ابحث أو أضف غرضاً</label>
        <input id="q" type="text" enterkeyhint="done" placeholder="ابحث… أو اكتب غرضاً جديداً">
        <button class="btn" type="submit">أضف</button>
      </form>
      <div id="chips" class="chips scr" role="group" aria-label="الأقسام"></div>
      <div id="editHint" class="hint" hidden>وضع التعديل: اضغط أي مربع لتغيير اسمه أو قسمه أو صورته، أو لحذفه.</div>
      <div id="grid" class="grid"></div>
    </section>
    <section id="shopView" class="view" hidden></section>
  </main>

  <footer><div id="dock" class="dock"></div></footer>
</div>

<div id="scrim" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="photoIn" type="file" accept="image/*" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
